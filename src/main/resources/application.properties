# ============================================
# College Football Stat Tracker - Configuration
# ============================================

# --- Active Profile ---
# Use 'dev' for H2 in-memory database (no setup required)
# Use 'prod' for MySQL database
spring.profiles.active=prod

# --- Server ---
server.port=8080

# --- CORS (allow frontend to connect) ---
# The frontend runs on port 5173 by default with Vite

# --- CFBD API ---
# Set CFBD_API_KEY in your env (or override here) so data pulls succeed.
cfbd.api.base=https://api.collegefootballdata.com
cfbd.api.key=${CFBD_API_KEY:pbkJknpsJxxFqUWeO7YUE2Eioxg8qptw8+olTVsbSxGBwwRkJoxenKL6ClAffJ7e}
